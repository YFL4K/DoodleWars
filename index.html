<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第一人称草稿本 · 圆珠笔手绘 DEMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<!-- HUD 叠加层 -->
<div id="hud">
  <!-- 中央红色准星（圆点 + 十字） -->
  <div id="crosshair">
    <div class="ch-line ch-h"></div>
    <div class="ch-line ch-v"></div>
    <div class="ch-dot"></div>
  </div>

  <!-- 左上：得分 / 波次 -->
  <div class="hud-top-left">
    <div class="hud-label hud-score">SCORE <span id="scoreVal">0000</span></div>
    <div class="hud-label hud-wave">WAVE <span id="waveVal">03</span></div>
  </div>

  <!-- 左下：HP 血条（宽、斜线纹理）+ 大字号子弹数 -->
  <div class="hud-bottom-left">
    <div class="hud-hp-row">
      <span class="hud-label">HP</span>
      <canvas id="hpCanvas" width="360" height="34"></canvas>
    </div>
    <div class="hud-ammo">
      <span id="ammoClip">35</span>
      <span class="ammo-sep">/</span>
      <span id="ammoReserve">175</span>
    </div>
  </div>

  <!-- 右下：武器切换菜单 -->
  <div class="hud-bottom-right">
    <div class="weapon active">RIFLE</div>
    <div class="weapon">SHOTGUN</div>
    <div class="weapon">SNIPER</div>
    <div class="weapon">KATANA</div>
  </div>
</div>

<div id="errorBox" style="position:fixed;top:0;left:0;z-index:999;background:#fff;color:#c0392b;padding:10px;font:12px monospace;white-space:pre-wrap;display:none;"></div>
<script>
window.addEventListener('error', function(e) {
  var box = document.getElementById('errorBox');
  box.style.display = 'block';
  box.textContent = 'ERROR: ' + e.message + '\n' + (e.filename||'') + ':' + (e.lineno||'');
});
window.addEventListener('unhandledrejection', function(e) {
  var box = document.getElementById('errorBox');
  box.style.display = 'block';
  box.textContent = 'PROMISE ERROR: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
});
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
