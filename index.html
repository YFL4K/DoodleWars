<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第一人称草稿本 · 圆珠笔手绘 DEMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<!-- HUD 叠加层（复刻 Doodle District 布局） -->
<div id="hud">
  <!-- 左上：得分 / 波次 -->
  <div class="hud-tl">
    <div>SCORE <b id="scoreVal">0000</b></div>
    <div class="hud-wave">WAVE <span id="waveVal">03</span></div>
  </div>

  <!-- 左下：HP 斜线血条 + 大字号弹药 + Tally 记数 -->
  <div class="hud-bl">
    <div class="health"><span>HP</span><div class="bar"><div class="fill" id="hpFill"></div></div></div>
    <div class="ammo"><b id="ammoClip">35</b><span> / <span id="ammoReserve">175</span></span></div>
    <div class="tally" id="tally"></div>
  </div>

  <!-- 右下：武器切换槽位 -->
  <div class="hud-br">
    <div class="slots" id="slots">
      <div class="slot active" data-w="0"><span class="num">1</span> RIFLE</div>
      <div class="slot" data-w="1"><span class="num">2</span> SHOTGUN</div>
      <div class="slot" data-w="2"><span class="num">3</span> SNIPER</div>
      <div class="slot" data-w="3"><span class="num">4</span> KATANA</div>
    </div>
  </div>

  <!-- 中央红色准星 -->
  <div class="crosshair" id="crosshair">
    <i class="ch-t"></i><i class="ch-b"></i><i class="ch-l"></i><i class="ch-r"></i><i class="ch-dot"></i>
  </div>

  <!-- 命中反馈 hitmarker -->
  <div class="hitmarker" id="hitmarker"><i></i><i></i></div>

  <!-- 击杀提示 killfeed -->
  <div class="killfeed" id="killfeed"></div>

  <!-- 中央大字消息 -->
  <div class="message" id="message">
    <div class="msg-main" id="msgMain"></div>
    <div class="msg-sub" id="msgSub"></div>
  </div>

  <!-- 狙击镜（SNIPER ADS） -->
  <div class="scope" id="scope">
    <div class="mask"></div><div class="ring"></div><div class="cx"></div><div class="cy"></div><div class="dot"></div>
  </div>
</div>

<div id="errorBox" style="position:fixed;top:0;left:0;z-index:999;background:#fff;color:#c0392b;padding:10px;font:12px monospace;white-space:pre-wrap;display:none;"></div>
<div id="dbg" style="position:fixed;right:4px;bottom:4px;z-index:999;color:#1a30c0;font:12px monospace;pointer-events:none;"></div>
<script>
window.addEventListener('error', function(e) {
  var box = document.getElementById('errorBox');
  box.style.display = 'block';
  box.textContent = 'ERROR: ' + e.message + '\n' + (e.filename||'') + ':' + (e.lineno||'');
});
window.addEventListener('unhandledrejection', function(e) {
  var box = document.getElementById('errorBox');
  box.style.display = 'block';
  box.textContent = 'PROMISE ERROR: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
});
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
